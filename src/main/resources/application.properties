spring.application.name=trustvault

spring.datasource.url=jdbc:h2:file:./data/trustvaultdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

trustvault.dev-owner.email=${TRUSTVAULT_DEV_OWNER_EMAIL:}
trustvault.dev-owner.password=${TRUSTVAULT_DEV_OWNER_PASSWORD:}
logging.level.org.springframework.security=INFO
trustvault.dev-viewer.email=${TRUSTVAULT_DEV_VIEWER_EMAIL:}
trustvault.dev-viewer.password=${TRUSTVAULT_DEV_VIEWER_PASSWORD:}
